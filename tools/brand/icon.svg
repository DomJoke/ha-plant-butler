<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="COAT_TOP"/>
      <stop offset="1" stop-color="COAT_BOTTOM"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e2895c"/>
      <stop offset="1" stop-color="#c2643a"/>
    </linearGradient>
  </defs>

  <!-- tailcoat with tails -->
  <path d="M124 396 L134 292 Q140 232 196 222 L244 222 Q296 232 300 292 L310 396 Q310 404 302 404 L132 404 Q124 404 124 396 Z"
        fill="url(#coat)"/>
  <!-- waistcoat / shirt -->
  <path d="M190 222 L250 222 L238 300 L220 372 L202 300 Z" fill="#ffffff"/>
  <path d="M202 300 L220 372 L238 300 L234 404 L206 404 Z" fill="#8d6e63"/>
  <!-- lapels -->
  <path d="M190 222 L174 248 L202 300 Z" fill="LAPEL"/>
  <path d="M250 222 L266 248 L238 300 Z" fill="LAPEL"/>
  <!-- bow tie in plant green -->
  <path d="M220 236 L192 222 L192 252 Z" fill="#2e7d32"/>
  <path d="M220 236 L248 222 L248 252 Z" fill="#2e7d32"/>
  <circle cx="220" cy="237" r="7" fill="#1b5e20"/>
  <!-- buttons -->
  <circle cx="220" cy="322" r="5" fill="#ffffff"/>
  <circle cx="220" cy="350" r="5" fill="#ffffff"/>

  <!-- left arm with towel -->
  <path d="M146 262 Q126 314 136 362" stroke="url(#coat)" stroke-width="40" stroke-linecap="round" fill="none"/>
  <path d="M110 330 L160 320 L166 392 L116 400 Z" fill="#ffffff"/>
  <path d="M114 358 L162 350" stroke="#cfd8dc" stroke-width="4"/>
  <circle cx="140" cy="376" r="17" fill="#ffffff" stroke="#cfd8dc" stroke-width="3"/>

  <!-- right arm raised, holding the tray -->
  <path d="M286 260 Q330 232 340 176" stroke="url(#coat)" stroke-width="40" stroke-linecap="round" fill="none"/>
  <circle cx="342" cy="166" r="19" fill="#ffffff" stroke="#cfd8dc" stroke-width="3"/>

  <!-- head -->
  <rect x="204" y="196" width="32" height="30" rx="8" fill="#e8b98f"/>
  <circle cx="220" cy="150" r="56" fill="#f3cba5"/>
  <path d="M164 146 Q164 92 220 92 Q276 92 276 146 Q262 120 228 116 L220 104 L214 117 Q182 120 164 146 Z" fill="#4e342e"/>
  <!-- closed, content eyes -->
  <path d="M192 152 Q200 145 208 152" stroke="#4e342e" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M232 152 Q240 145 248 152" stroke="#4e342e" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- curled moustache -->
  <path d="M220 176 Q206 166 194 174 Q186 180 180 172 Q186 192 204 184 Q214 180 220 182 Q226 180 236 184 Q254 192 260 172 Q254 180 246 174 Q234 166 220 176 Z" fill="#4e342e"/>

  <!-- tray -->
  <ellipse cx="372" cy="152" rx="104" ry="15" fill="#90a4ae"/>
  <ellipse cx="372" cy="148" rx="104" ry="13" fill="#cfd8dc"/>

  <!-- potted plant -->
  <path d="M336 96 L408 96 L398 146 L346 146 Z" fill="url(#pot)"/>
  <rect x="330" y="86" width="84" height="16" rx="5" fill="#d0703f"/>
  <!-- leaves -->
  <path d="M372 88 Q328 70 318 26 Q360 34 372 88 Z" fill="#43a047"/>
  <path d="M372 88 Q414 68 428 28 Q384 34 372 88 Z" fill="#2e7d32"/>
  <path d="M372 88 Q352 44 372 6 Q392 44 372 88 Z" fill="#66bb6a"/>
  <path d="M372 88 Q330 92 306 64 Q346 56 372 88 Z" fill="#388e3c"/>
  <path d="M372 88 Q414 94 440 66 Q398 56 372 88 Z" fill="#4caf50"/>
  <path d="M372 86 V30 M372 86 L336 46 M372 86 L410 46" stroke="#a5d6a7" stroke-width="2.5" stroke-linecap="round" fill="none"/>
</svg>
