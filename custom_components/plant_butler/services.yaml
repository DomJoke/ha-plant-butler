mark_done:
  fields:
    entity_id:
      selector:
        entity:
          integration: plant_butler
          multiple: true
    device_id:
      selector:
        device:
          integration: plant_butler
          multiple: true
    task:
      required: true
      selector:
        select:
          options:
            - water
            - fertilize
          translation_key: task

watering_feedback:
  fields:
    entity_id:
      selector:
        entity:
          integration: plant_butler
          multiple: true
    device_id:
      selector:
        device:
          integration: plant_butler
          multiple: true
    answer:
      required: true
      selector:
        select:
          options:
            - moist
            - ok
            - dry
          translation_key: feedback

undo_watering:
  fields:
    entity_id:
      selector:
        entity:
          integration: plant_butler
          multiple: true
    device_id:
      selector:
        device:
          integration: plant_butler
          multiple: true
